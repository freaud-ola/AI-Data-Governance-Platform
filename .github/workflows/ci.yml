# Sprint 03 接续：后端 ruff + pytest（覆盖率门槛）、前端 lint/typecheck/build；
# 可选矩阵：在 PostgreSQL 服务上跑同一套 API 冒烟（USE_MOCK=false）。
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint-test:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff
        run: ruff check app tests

      - name: Pytest with coverage
        run: pytest -q

      - name: Upload coverage XML
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: backend/coverage.xml
          if-no-files-found: warn

  backend-postgres:
    name: Backend (PostgreSQL integration)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: adg
          POSTGRES_PASSWORD: adg_ci_pwd
          POSTGRES_DB: adg
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U adg -d adg"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      USE_MOCK: "false"
      DATABASE_URL: postgresql+psycopg://adg:adg_ci_pwd@127.0.0.1:5432/adg
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Pytest against PostgreSQL
        run: pytest -q

  frontend:
    name: Frontend (lint + typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint (strict)
        run: npm run lint:strict

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
